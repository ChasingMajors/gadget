<!doctype html>
<html lang="en" data-cm-source="ebay">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CM Rarity Gadget Harness</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f8fafc;
        color: #111827;
        margin: 0;
      }

      header {
        align-items: center;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 16px 20px;
        position: sticky;
        top: 0;
        z-index: 5;
      }

      h1 {
        font-size: 18px;
        letter-spacing: 0;
        margin: 0;
      }

      .controls {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .controls button,
      .controls select {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        color: #111827;
        font: inherit;
        font-size: 13px;
        min-height: 34px;
        padding: 7px 10px;
      }

      .controls button {
        cursor: pointer;
        font-weight: 700;
      }

      main {
        margin: 0 auto;
        max-width: 1180px;
        padding: 24px 20px 40px;
      }

      .s-results {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .s-item {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
      }

      .s-item a {
        color: inherit;
        display: block;
        text-decoration: none;
      }

      .s-item__image {
        align-items: center;
        background: #e2e8f0;
        display: flex;
        justify-content: center;
        min-height: 250px;
        position: relative;
      }

      .s-item img {
        display: block;
        height: 250px;
        object-fit: cover;
        width: 100%;
      }

      .s-item__details {
        padding: 12px;
      }

      .s-item__title {
        display: block;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.35;
      }

      .s-item__price {
        color: #166534;
        display: block;
        font-size: 15px;
        font-weight: 800;
        margin-top: 8px;
      }

      .status {
        color: #475569;
        font-size: 13px;
      }
    </style>
    <script>
      window.chrome = window.chrome || {};
      chrome.storage = chrome.storage || {};
      chrome.storage.local = chrome.storage.local || {
        get(keys, callback) {
          const result = {};
          const requested = Array.isArray(keys) ? keys : Object.keys(keys || {});
          requested.forEach((key) => {
            const raw = window.localStorage.getItem(key);
            if (raw) {
              result[key] = JSON.parse(raw);
            }
          });
          callback(result);
        },
        set(values, callback) {
          Object.entries(values).forEach(([key, value]) => {
            window.localStorage.setItem(key, JSON.stringify(value));
          });
          callback?.();
        }
      };
    </script>
  </head>
  <body>
    <header>
      <div>
        <h1>CM Rarity Gadget Harness</h1>
        <div class="status" id="status">anonymous/free</div>
      </div>
      <div class="controls">
        <select id="source">
          <option value="ebay">eBay DOM</option>
          <option value="comc">COMC DOM</option>
        </select>
        <button type="button" data-state="anonymous">Anonymous/free</button>
        <button type="button" data-state="logged_in">Logged in/free</button>
        <button type="button" data-state="paid">Paid</button>
        <button type="button" data-state="admin">Admin MVP</button>
        <button type="button" id="reset">Reset usage</button>
      </div>
    </header>

    <main>
      <ul class="s-results">
        <li class="s-item">
          <a href="#">
            <div class="s-item__image">
              <img alt="2024 Topps Chrome Victor Wembanyama Green Refractor RC /99 PSA 10" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 560'%3E%3Crect width='420' height='560' fill='%23f8fafc'/%3E%3Crect x='52' y='42' width='316' height='476' rx='24' fill='%23111827'/%3E%3Crect x='78' y='72' width='264' height='334' rx='16' fill='%23dbeafe'/%3E%3Ccircle cx='210' cy='194' r='68' fill='%2322c55e'/%3E%3Crect x='91' y='430' width='238' height='28' rx='8' fill='%23ffffff'/%3E%3Crect x='121' y='470' width='178' height='20' rx='8' fill='%23ffffff'/%3E%3C/svg%3E">
            </div>
            <div class="s-item__details">
              <span class="s-item__title">2024 Topps Chrome Victor Wembanyama Green Refractor RC /99 PSA 10</span>
              <span class="s-item__price">$1,250.00</span>
            </div>
          </a>
        </li>
        <li class="s-item">
          <a href="#">
            <div class="s-item__image">
              <img alt="2023 Bowman Chrome Jackson Holliday Gold Auto /50 BGS 9.5" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 560'%3E%3Crect width='420' height='560' fill='%23ecfeff'/%3E%3Crect x='50' y='40' width='320' height='480' rx='24' fill='%230f172a'/%3E%3Crect x='78' y='72' width='264' height='332' rx='16' fill='%23fef3c7'/%3E%3Cpath d='M125 278 L210 126 L296 278 Z' fill='%23f59e0b'/%3E%3Crect x='91' y='430' width='238' height='28' rx='8' fill='%23ffffff'/%3E%3Crect x='121' y='470' width='178' height='20' rx='8' fill='%23ffffff'/%3E%3C/svg%3E">
            </div>
            <div class="s-item__details">
              <span class="s-item__title">2023 Bowman Chrome Jackson Holliday Gold Auto /50 BGS 9.5</span>
              <span class="s-item__price">$875.00</span>
            </div>
          </a>
        </li>
        <li class="s-item">
          <a href="#">
            <div class="s-item__image">
              <img alt="2022 Panini Prizm Patrick Mahomes Color Blast SSP PSA 10" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 560'%3E%3Crect width='420' height='560' fill='%23fef2f2'/%3E%3Crect x='50' y='40' width='320' height='480' rx='24' fill='%23111827'/%3E%3Crect x='78' y='72' width='264' height='332' rx='16' fill='%23fee2e2'/%3E%3Ccircle cx='158' cy='190' r='54' fill='%23ef4444'/%3E%3Ccircle cx='262' cy='230' r='62' fill='%233b82f6'/%3E%3Crect x='91' y='430' width='238' height='28' rx='8' fill='%23ffffff'/%3E%3Crect x='121' y='470' width='178' height='20' rx='8' fill='%23ffffff'/%3E%3C/svg%3E">
            </div>
            <div class="s-item__details">
              <span class="s-item__title">2022 Panini Prizm Patrick Mahomes Color Blast SSP PSA 10</span>
              <span class="s-item__price">$2,999.00</span>
            </div>
          </a>
        </li>
      </ul>
    </main>

    <script src="../config.js?v=4"></script>
    <script src="../storage.js?v=4"></script>
    <script src="../parser.js?v=4"></script>
    <script src="../api.js?v=4"></script>
    <script src="../ui.js?v=4"></script>
    <script src="../content.js?v=4"></script>
    <script>
      const status = document.getElementById("status");

      async function setState(state) {
        const next = state === "admin"
          ? { status: "admin", plan: "admin" }
          : state === "paid"
          ? { status: "logged_in", plan: "paid" }
          : { status: state, plan: "free" };
        await window.CMRarityStorage.setUserState(next);
        status.textContent = `${next.status}/${next.plan}`;
      }

      document.querySelectorAll("[data-state]").forEach((button) => {
        button.addEventListener("click", () => setState(button.dataset.state));
      });

      document.getElementById("reset").addEventListener("click", () => {
        window.localStorage.removeItem(window.CMRarityStorage.STORAGE_KEYS.DAILY_USAGE);
        window.location.reload();
      });

      document.getElementById("source").addEventListener("change", (event) => {
        document.documentElement.dataset.cmSource = event.target.value;
        window.location.reload();
      });

      window.CMRarityStorage.getUserState().then((state) => {
        status.textContent = `${state.status}/${state.plan}`;
      });
    </script>
  </body>
</html>
